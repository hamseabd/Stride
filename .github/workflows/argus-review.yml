# Argus (https://github.com/hamseabd/argus) reviews pull requests on this
# repository: a lead reviewer fans out to read-only specialists, an
# independent verifier checks every finding, and the result is posted as
# inline review comments under the Argus GitHub App's own name. The workflow
# lives in the argus repository and is pinned to a commit (the v1 release)
# because it receives secrets; the pull request head is read, never executed.
#
# Needs three repository secrets: CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`), and ARGUS_APP_ID and ARGUS_APP_PRIVATE_KEY for the
# app, which must be installed on this repository. This workflow's own token
# stays read-only; the app token posts the review.
# It runs once, when the pull request opens or leaves draft; a maintainer can
# rerun it by toggling the pull request through draft. Do not add a
# concurrency group here: the called workflow already keys one on the pull
# request number, and a duplicate makes GitHub cancel both as a deadlock.

name: argus-review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    # Drafts are skipped, and so are forks, which get no secrets and a read-only token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: hamseabd/argus/.github/workflows/review.yml@55f7a0ad8dfa436af7ba1e10d690f57612c751a6 # v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ARGUS_APP_ID: ${{ secrets.ARGUS_APP_ID }}
      ARGUS_APP_PRIVATE_KEY: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
