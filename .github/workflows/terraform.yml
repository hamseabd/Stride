name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "scrumbot-infra/**"
      - "scrumbot-app/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scrumbot-infra/**"
      - "scrumbot-app/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  TF_DIR: scrumbot-infra
  AWS_REGION: us-east-1

jobs:

  # ── Unit tests + deterministic evals (no LLM calls, no AWS) ──────────────
  test:
    name: Tests (unit + L1 evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd scrumbot-app && pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: cd scrumbot-app && python -m pytest tests/ -q --tb=short --cov=shared --cov=functions --cov-report=term-missing:skip-covered
      - name: L1 assertions + regression
        run: cd scrumbot-app && python -m pytest evals/l1/test_assertions.py evals/regression/ -q --tb=short -m "not integration"

  # ── Build and push Docker images to ECR ─────────────────────────────────
  docker:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # PRs assume the read-only plan role; main pushes assume the write role.
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

      # The runner is amd64 but images target linux/arm64 (Graviton Lambda).
      # QEMU registers binfmt handlers so the cross-arch `RUN pip install` works.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        run: |
          chmod +x scripts/build_and_push.sh
          ./scripts/build_and_push.sh ${{ steps.meta.outputs.tag }}

  # ── Terraform plan (PR) or apply (push to main) ─────────────────────────
  terraform:
    name: Terraform ${{ github.event_name == 'push' && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    needs: [docker, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Format Check
        run: terraform -chdir=$TF_DIR fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=$TF_DIR init

      - name: Terraform Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: |
          terraform -chdir=$TF_DIR plan \
            -var="image_tag=${{ needs.docker.outputs.image_tag }}" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var="twilio_auth_token=${{ secrets.TWILIO_AUTH_TOKEN }}" \
            -var="twilio_account_sid=${{ secrets.TWILIO_ACCOUNT_SID }}" \
            -var="twilio_phone_number=${{ secrets.TWILIO_PHONE_NUMBER }}"

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform -chdir=$TF_DIR apply -auto-approve \
            -var="image_tag=${{ needs.docker.outputs.image_tag }}" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var="twilio_auth_token=${{ secrets.TWILIO_AUTH_TOKEN }}" \
            -var="twilio_account_sid=${{ secrets.TWILIO_ACCOUNT_SID }}" \
            -var="twilio_phone_number=${{ secrets.TWILIO_PHONE_NUMBER }}"
