<svg xmlns="http://www.w3.org/2000/svg" width="360" height="684" viewBox="0 0 360 684"><rect width="360" height="684" fill="#ffffff"/><rect x="20" y="20" rx="14" ry="14" width="265" height="218" fill="#e5e7eb"/><text x="30" y="43" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">Hey! I&#x27;m Stride. Tell me what you</text><text x="30" y="61" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">want to finish — a project, a big</text><text x="30" y="79" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">goal, anything that takes more</text><text x="30" y="97" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">than three weeks. I&#x27;ll help you</text><text x="30" y="115" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">break it down, plan each week, and</text><text x="30" y="133" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">check in daily to keep you on</text><text x="30" y="151" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">track. Just text me like you&#x27;d</text><text x="30" y="169" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">text a friend — one goal at a</text><text x="30" y="187" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">time. Reply REMIND ME anytime for</text><text x="30" y="205" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">daily check-ins. What should I</text><text x="30" y="223" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">call you?</text><rect x="97" y="250" rx="14" ry="14" width="243" height="92" fill="#2563eb"/><text x="107" y="273" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">Hey, I&#x27;m Jordan. I&#x27;m building a</text><text x="107" y="291" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">Chrome extension that blocks</text><text x="107" y="309" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">distracting sites. I want it on</text><text x="107" y="327" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">the Web Store in six weeks.</text><rect x="20" y="354" rx="14" ry="14" width="258" height="74" fill="#e5e7eb"/><text x="30" y="377" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">Got it — Chrome extension live on</text><text x="30" y="395" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">the Web Store by October 16.</text><text x="30" y="413" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">You&#x27;re in Eastern time, right?</text><rect x="82" y="440" rx="14" ry="14" width="258" height="92" fill="#2563eb"/><text x="92" y="463" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">This week I want to finish the</text><text x="92" y="481" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">blocklist UI and get the options</text><text x="92" y="499" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">page working. A day or two each I</text><text x="92" y="517" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">think.</text><rect x="20" y="544" rx="14" ry="14" width="265" height="128" fill="#e5e7eb"/><text x="30" y="567" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">You&#x27;re all set, Jordan. This week:</text><text x="30" y="585" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">Finish blocklist UI Get options</text><text x="30" y="603" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">page working  That&#x27;s about 3-4</text><text x="30" y="621" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">days of work. Text me anytime to</text><text x="30" y="639" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">update progress or flag something</text><text x="30" y="657" font-size="13" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#111827">that&#x27;s stuck. Good luck!</text></svg>
