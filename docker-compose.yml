services:

  # ── LocalStack (DynamoDB) ──────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── DynamoDB table bootstrap (runs once, exits) ────────────────────────────
  init-db:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - dynamodb
      - create-table
      - --endpoint-url
      - http://localstack:4566
      - --table-name
      - stride-local
      - --attribute-definitions
      - AttributeName=pk,AttributeType=S
      - AttributeName=sk,AttributeType=S
      - AttributeName=gsi1pk,AttributeType=S
      - AttributeName=gsi1sk,AttributeType=S
      - --key-schema
      - AttributeName=pk,KeyType=HASH
      - AttributeName=sk,KeyType=RANGE
      - --billing-mode
      - PAY_PER_REQUEST
      - --global-secondary-indexes
      - "[{\"IndexName\":\"gsi1\",\"KeySchema\":[{\"AttributeName\":\"gsi1pk\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"gsi1sk\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]"

  # ── Local API server (same Linux ARM64 Python as Lambda) ──────────────────
  api:
    build:
      context: ./scrumbot-app
      dockerfile: Dockerfile.dev
    platform: linux/arm64
    ports:
      - "8000:8000"
    volumes:
      - ./scrumbot-app:/app    # hot reload — code changes reflected instantly
    env_file:
      - ./scrumbot-app/.env    # reads ANTHROPIC_API_KEY and other local secrets
    environment:
      # These override .env values for correct Docker networking
      DYNAMODB_TABLE_NAME: stride-local
      ENVIRONMENT: local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command: ["python", "local_server.py", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      init-db:
        condition: service_completed_successfully

volumes:
  localstack_data:
